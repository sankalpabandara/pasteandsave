<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../popup.css" />
    <script>
      // Mock extension API with fixture data so the real popup.js can run in
      // a plain browser tab. Mirrors the shapes background.js produces.
      const FIXTURE_ITEMS = [
        {
          key: "a", url: "https://cdn.example.com/videos/big-trailer.mp4",
          kind: "file", size: 52428800, contentType: "video/mp4",
          filename: "big-trailer.mp4", foundAt: 1,
        },
        {
          key: "b", url: "https://cdn.example.com/audio/podcast-episode.mp3",
          kind: "file", size: 4200000, contentType: "audio/mpeg",
          filename: "podcast-episode.mp3", foundAt: 2,
        },
        {
          key: "c", url: "https://video.example.com/live/master.m3u8",
          kind: "stream", size: 0, contentType: "application/vnd.apple.mpegurl",
          filename: "master.m3u8", foundAt: 3,
        },
        {
          key: "d", url: "https://cdn.example.com/videos/second-clip.webm",
          kind: "file", size: 9000000, contentType: "video/webm",
          filename: "second-clip.webm", foundAt: 4,
        },
      ];
      window.__log = [];
      window.chrome = {
        tabs: {
          query: async () => [{ id: 1, url: "https://vimeo.com/123456789" }],
          create: (opts) => window.__log.push("tab:" + opts.url),
        },
        runtime: {
          sendMessage: (msg, cb) => {
            window.__log.push("msg:" + msg.type);
            if (msg.type === "getMedia") cb({ items: FIXTURE_ITEMS, minBytes: 204800 });
            else if (msg.type === "download") setTimeout(() => cb({ ok: true }), 30);
            else cb({ ok: true });
          },
          lastError: null,
        },
      };
      // window.close is a no-op here so assertions can still run.
      window.close = () => window.__log.push("closed");
    </script>
  </head>
  <body>
    <header>
      <div class="badge">
        <svg width="18" height="18" viewBox="0 0 40 40" fill="none">
          <path d="M20 9.5 V22" stroke="#fff" stroke-width="3.4" stroke-linecap="round" />
          <path d="M14.3 16.7 L20 22.6 L25.7 16.7" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M12 27.5 H28" stroke="#fff" stroke-width="3.4" stroke-linecap="round" />
        </svg>
      </div>
      <span class="wordmark">PasteAnd<em>Save</em></span>
      <span class="shortcut" title="Keyboard shortcut">Alt+Shift+S</span>
    </header>

    <main>
      <button id="save-page" class="primary">
        <span id="save-page-label">Download this page's video</span>
        <span class="host" id="page-host"></span>
      </button>

      <section id="media-section" hidden>
        <div class="list-head">
          <p class="section-title">Found on this page</p>
          <button id="save-all" class="save-all" hidden>Save all</button>
        </div>
        <div class="filters" id="filters">
          <button class="filter active" data-filter="all">All</button>
          <button class="filter" data-filter="video">Video</button>
          <button class="filter" data-filter="audio">Audio</button>
          <button class="filter" data-filter="stream">Streams</button>
        </div>
        <ul id="media-list"></ul>
      </section>

      <p id="empty" class="empty">
        Nothing detected yet. Press play on a video or audio and it shows up
        here on its own.
      </p>
    </main>

    <footer>
      <label class="min-size">
        Ignore files under
        <select id="min-size">
          <option value="51200">50 KB</option>
          <option value="204800">200 KB</option>
          <option value="1048576">1 MB</option>
        </select>
      </label>
      <a href="https://pasteandsave.com" target="_blank" rel="noopener">
        pasteandsave.com
      </a>
    </footer>

    <script src="../popup.js"></script>
  </body>
</html>
