<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="badge">
        <svg width="18" height="18" viewBox="0 0 40 40" fill="none">
          <path d="M20 9.5 V22" stroke="#fff" stroke-width="3.4" stroke-linecap="round" />
          <path d="M14.3 16.7 L20 22.6 L25.7 16.7" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M12 27.5 H28" stroke="#fff" stroke-width="3.4" stroke-linecap="round" />
        </svg>
      </div>
      <span class="wordmark">PasteAnd<em>Save</em></span>
    </header>

    <main>
      <button id="save-page" class="primary">
        <span id="save-page-label">Download this page's video</span>
        <span class="host" id="page-host"></span>
      </button>

      <section id="media-section" hidden>
        <p class="section-title">Found on this page</p>
        <ul id="media-list"></ul>
      </section>

      <p id="empty" class="empty">
        Nothing detected yet. Press play on a video or audio and it shows up
        here on its own.
      </p>
    </main>

    <footer>
      <a href="https://pasteandsave.com" target="_blank" rel="noopener">
        1,200+ sites · pasteandsave.com
      </a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
